[package]
name = "crosstrace"
version = "0.1.0"
edition = "2021"
description = "CrossTrace desktop shell"
license = "MIT"

# The application logic lives in a library so the same `run()` entry point
# builds for desktop (bin) and Android (cdylib, loaded by the generated
# mobile project).
[lib]
name = "crosstrace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crosstrace-core = { path = "../core" }

[features]
# Enabled by `tauri build`/`tauri dev` to produce a smaller binary.
custom-protocol = ["tauri/custom-protocol"]
