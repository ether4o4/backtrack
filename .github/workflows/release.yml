name: Build desktop installers

# Produces downloadable backtrack desktop installers for Linux, macOS and
# Windows. Run it manually from the Actions tab (workflow_dispatch), or push a
# version tag (e.g. v0.1.0) to also publish the installers to a GitHub Release
# with direct download links.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/crosstrace-app-design-ucnqcg"
    tags:
      - "v*"

# Needed so the release step can create/attach binaries on tag pushes.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'core/Cargo.lock') }}

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          # install-action rejects semver operators (e.g. ^2.0); pin an exact
          # 2.x version (validated locally).
          tool: tauri-cli@2.11.4

      - name: Build the app + bundles
        run: cargo tauri build

      - name: Upload installers as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtrack-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe

      - name: Attach installers to the release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
