name: Build Android APK

# Produces a downloadable, debug-signed backtrack Android APK and publishes it to
# a rolling "nightly" GitHub Release (direct .apk link in README).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/crosstrace-app-design-ucnqcg"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'core/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Initialise the Android project
        run: cargo tauri android init

      - name: Build the debug APK
        run: cargo tauri android build --apk --debug

      - name: List built APKs
        run: find src-tauri/gen/android -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtrack-android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to the release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the freshly built debug APK to a single rolling "nightly" release so
  # the README download link always points at the latest build (a raw .apk, no zip).
  release:
    name: Publish rolling debug APK
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/crosstrace-app-design-ucnqcg')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: backtrack-android-apk
          path: apk

      - name: Stage APK under a stable name
        run: |
          mkdir -p dist
          apk="$(find apk -path '*/universal/*/*.apk' | head -n1)"
          if [ -z "$apk" ]; then apk="$(find apk -path '*arm64*/*.apk' | head -n1); fi
          if [ -z "$apk" ]; then apk="$(find apk -name '*.apk' | head -n1)"; fi
          if [ -z "$apk" ]; then echo "No APK found in artifact" >&2; exit 1; fi
          cp "$apk" dist/backtrack-debug.apk
          ls -lh dist/

      - name: Publish to rolling "nightly" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: CrossTrace / backtrack (latest debug build)
          prerelease: true
          files: dist/backtrack-debug.apk
          body: |
            Auto-published debug APK, rebuilt on every push to `main` or the working branch.

            Commit: ${{ github.sha }}

            Debug-signed. Enable *Install unknown apps* on your phone, then open the APK.