name: Build Android APK

# Produces a downloadable, debug-signed backtrack Android APK. Run it manually
# from the Actions tab (workflow_dispatch) or let it fire on pushes to the
# working branch. The APK is a build artifact on the run; it is debug-signed,
# so install it on a phone by allowing "install from unknown sources".
#
# This sandbox has no Android SDK/NDK, so the APK is built here on GitHub's
# runners, the same way the desktop installers are.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/crosstrace-app-design-ucnqcg"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'core/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.11.4

      - name: Initialise the Android project
        run: cargo tauri android init

      - name: Build the debug APK
        run: cargo tauri android build --apk --debug

      - name: List built APKs
        run: find src-tauri/gen/android -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtrack-android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Attach APK to the release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
