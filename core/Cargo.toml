[package]
name = "crosstrace-core"
version = "0.1.0"
edition = "2021"
description = "Offline-first ingest, normalization, correlation and search engine for CrossTrace"
license = "MIT"

[lib]
name = "crosstrace_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
quick-xml = "0.36"
thiserror = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
